<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Alaric Health Services</title>

  <meta
    name="description"
    content="Thank you for contacting Alaric Health Services. We have received your inquiry and will get back to you soon."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4fbfa;
      color: #123c46;
    }

    .thank-you {
      width: 100%;
      max-width: 620px;
      padding: 55px 35px;
      text-align: center;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(18, 60, 70, 0.12);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #0f9d8a;
      color: #ffffff;
      font-size: 36px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 36px;
    }

    p {
      margin: 0 auto 30px;
      max-width: 500px;
      color: #587078;
      font-size: 17px;
      line-height: 1.7;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 8px;
      background: #0f9d8a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .btn:hover {
      background: #0c8575;
    }

    @media (max-width: 600px) {
      .thank-you {
        padding: 40px 24px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <div class="thank-you">

    <div class="icon">✓</div>

    <h1>Thank You!</h1>

    <p>
      Your inquiry has been received successfully.
      Our team will review your message and get back to you soon.
    </p>

    <a href="https://alarichealthservices.com/" class="btn">
      Back to Alaric Health Services
    </a>

  </div>

</body>
</html>
